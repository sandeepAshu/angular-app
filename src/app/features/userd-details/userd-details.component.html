
<div class="container" >
    <form [formGroup]="userDetailsForm">
        <div class="forms justify-content-around">
            <mat-form-field >
                <mat-label>Name</mat-label>
                <input matInput formControlName="name"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Email</mat-label>
                <input matInput formControlName="email"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Phone</mat-label>
                <input matInput formControlName="phone"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Username</mat-label>
                <input matInput formControlName="username"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Website</mat-label>
                <input matInput formControlName="website"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Street</mat-label>
                <input matInput formControlName="street"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Suite</mat-label>
                <input matInput formControlName="suite"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>City</mat-label>
                <input matInput formControlName="city"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Zipcode</mat-label>
                <input matInput formControlName="zipcode"  />
            </mat-form-field>

            <!-- Company Fields -->
            <mat-form-field >
                <mat-label>Company Name</mat-label>
                <input matInput formControlName="companyName"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>Catch Phrase</mat-label>
                <input matInput formControlName="catchPhrase"  />
            </mat-form-field>

            <mat-form-field >
                <mat-label>BS</mat-label>
                <input matInput formControlName="bs"  />
            </mat-form-field>
        </div>

        <button mat-raised-button  mat-dialog-close>Cancel</button>
    </form>
</div>
